# Pre-commit: guard hook contract tests and a staged secret scan.
pre-commit:
  commands:
    guard-tests:
      glob: "skills/maintain-skill-library/scripts/hooks/*"
      run: /usr/bin/python3 skills/maintain-skill-library/scripts/hooks/test_guard.py && /usr/bin/python3 skills/maintain-skill-library/scripts/hooks/stop-check.py --selftest
    gitleaks:
      run: gitleaks protect --staged --redact --no-banner

# Pre-push runs `just check` on each pushed commit (skipped when that commit
# already passed). Same command as agents and ship.
pre-push:
  commands:
    check:
      use_stdin: true
      run: .ci/bin/ci-pre-push
